<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudNotes | My Notes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-brand">

                <div class="brand-icon">
                    <i class="bi bi-cloud-fill"></i>
                </div>

                <div>
                    <h2>CloudNotes</h2>
                    <span>Student Portal</span>
                </div>

            </div>


            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-grid"></i>
                    <span>Dashboard</span>
                </a>

                <a href="files.html" class="nav-link active">
                    <i class="bi bi-folder2-open"></i>
                    <span>My Notes</span>
                </a>

                <a href="upload.html" class="nav-link">
                    <i class="bi bi-cloud-upload"></i>
                    <span>Upload Notes</span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <button class="nav-link theme-btn" onclick="toggleTheme()">
                    <i class="bi bi-moon-stars"></i>
                    <span>Dark Mode</span>
                </button>

                <button class="nav-link logout-btn" onclick="logout()">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Logout</span>
                </button>

            </div>

        </aside>


        <main class="main-content">

            <header class="topbar">

                <button class="mobile-menu" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>

                <div>

                    <h1>My Notes</h1>

                    <p>
                        Manage your academic documents
                    </p>

                </div>

                <div class="topbar-actions">

                    <button class="icon-btn" onclick="toggleTheme()">
                        <i class="bi bi-moon-stars"></i>
                    </button>

                    <div class="user-avatar">
                        IM
                    </div>

                </div>

            </header>


            <section class="content">

                <!-- PAGE HEADER -->

                <div class="page-actions">

                    <div>

                        <h2>All Notes</h2>

                        <p>
                            Search and manage your uploaded documents.
                        </p>

                    </div>

                    <a href="upload.html" class="btn btn-primary">

                        <i class="bi bi-cloud-upload"></i>

                        Upload Note

                    </a>

                </div>


                <!-- FILTER -->

                <div class="filter-card">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input type="text" id="searchFiles" placeholder="Search notes..." oninput="renderFiles()">

                    </div>


                    <select id="subjectFilter" onchange="renderFiles()">

                        <option value="all">
                            All Subjects
                        </option>

                        <option value="Cloud Computing">
                            Cloud Computing
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="DBMS">
                            DBMS
                        </option>

                        <option value="Machine Learning">
                            Machine Learning
                        </option>

                    </select>

                </div>


                <!-- FILE TABLE -->

                <div class="table-card">

                    <div class="table-responsive">

                        <table>

                            <thead>

                                <tr>

                                    <th>File</th>
                                    <th>Subject</th>
                                    <th>Uploaded By</th>
                                    <th>Date</th>
                                    <th>Size</th>
                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody id="filesTable">

                            </tbody>

                        </table>

                    </div>

                    <div id="emptyState" class="empty-state">

                        <i class="bi bi-folder-x"></i>

                        <h3>No Notes Found</h3>

                        <p>
                            Upload your first academic note.
                        </p>

                        <a href="upload.html" class="btn btn-primary">

                            Upload Note

                        </a>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
